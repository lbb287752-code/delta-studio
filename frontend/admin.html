<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Studio 管理后台</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.admin-body { background: var(--bg-primary); padding-top: 0; }
.admin-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.admin-login .modal { max-width: 400px; width: 100%; transform: none; border:1px solid var(--neon-dim); }
.admin-login .modal .logo-text { font-size:36px; font-weight:800; background:linear-gradient(135deg,var(--neon),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; }
.admin-layout { display: none; min-height: 100vh; }
.admin-layout.active { display: flex; }
.admin-sidebar { width: 240px; background: var(--bg2); border-right: 1px solid var(--border); padding: 20px 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
.admin-sidebar .logo { padding: 0 20px 20px; font-size: 16px; font-weight: 700; border-bottom: 1px solid var(--border); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text); }
.admin-sidebar .logo .brand-icon { font-size:22px; color:var(--neon); text-shadow:0 0 10px rgba(0,240,255,0.4); }
.admin-sidebar .logo .badge { font-size: 9px; background: var(--neon); color: var(--bg); padding: 2px 7px; border-radius: 3px; font-weight: 700; letter-spacing:0.5px; }
.admin-nav { list-style: none; flex: 1; padding:0; margin:0; }
.admin-nav li { padding:0; margin:2px 0; list-style:none; }
.admin-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--trans); cursor: pointer; border-left:2px solid transparent; }
.admin-nav a:hover { color: var(--neon); background: rgba(0,240,255,0.04); }
.admin-nav a.active { color: var(--neon); background: rgba(0,240,255,0.06); border-left-color:var(--neon); box-shadow:inset 0 0 20px rgba(0,240,255,0.03); }
.admin-nav a .icon { font-size: 16px; width: 22px; text-align: center; }
.admin-logout { padding: 14px 20px; border-top: 1px solid var(--border); color: var(--text3); font-size: 12px; cursor: pointer; transition: var(--trans); display:flex; align-items:center; gap:8px; }
.admin-logout:hover { color: var(--red); }
.admin-main { margin-left: 240px; flex: 1; padding: 28px; min-height: 100vh; max-width: calc(100vw - 240px); }
.admin-header { margin-bottom: 24px; }
.admin-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
.admin-header p { color: var(--text2); font-size: 13px; }
.admin-page { display: none; }
.admin-page.active { display: block; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; transition: var(--trans); }
.stat-card:hover { border-color: rgba(0,240,255,0.2); box-shadow: 0 0 16px rgba(0,240,255,0.06); }
.stat-card .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight:600; }
.stat-card .stat-value { font-size: 28px; font-weight: 800; color: var(--text); }
.stat-card .stat-value.neon { color: var(--neon); }
.stat-card .stat-value.green { color: var(--green); }
.stat-card .stat-value.red { color: var(--red); }
.data-table { width: 100%; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.data-table thead th { text-align: left; padding: 12px 14px; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
.data-table tbody td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text2); }
.data-table tbody tr:last-child td { border-bottom:none; }
.data-table tbody tr:hover td { background: rgba(0,240,255,0.03); }
.data-table .status-badge { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; }
.status-badge.pending { background: rgba(255,165,2,0.12); color: var(--gold); }
.status-badge.confirmed { background: rgba(34,197,94,0.12); color: var(--green); }
.status-badge.processing { background: rgba(0,240,255,0.12); color: var(--neon); }
.status-badge.completed { background: rgba(34,197,94,0.12); color: var(--green); }
.status-badge.cancelled { background: rgba(239,68,68,0.12); color: var(--red); }
.status-badge.unread { background: rgba(239,68,68,0.12); color: var(--red); }
.status-badge.read { background: rgba(0,240,255,0.08); color: var(--neon); }
.status-badge.replied { background: rgba(34,197,94,0.12); color: var(--green); }
.data-table .actions { display: flex; gap: 6px; white-space:nowrap; }
.data-table .actions button { padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 11px; cursor: pointer; transition: var(--trans); font-family: inherit; font-weight:500; }
.data-table .actions button:hover { border-color: var(--neon); color: var(--neon); box-shadow:0 0 8px rgba(0,240,255,0.1); }
.data-table .actions button.danger:hover { border-color: var(--red); color: var(--red); box-shadow:0 0 8px rgba(239,68,68,0.1); }
.empty-state { text-align: center; padding: 50px; color: var(--text3); font-size:14px; }
.modal-content { max-width: 520px; }
.flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.admin-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
#adminModal.modal-overlay { z-index: 3000; }
#replyModal.modal-overlay { z-index: 3001; }
#adminToast { z-index: 9999; }
#adminToast .toast { background: var(--bg-card); border-color: var(--border); }
@media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-left: 0; padding: 16px; max-width:100vw; } .stats-grid { grid-template-columns: repeat(2, 1fr); } .data-table { font-size: 12px; overflow-x: auto; display: block; } .data-table .actions button { padding: 3px 8px; font-size:10px; } }
</style>
</head>
<body class="admin-body">

<div class="admin-login" id="adminLogin">
  <div class="modal" style="transform:none;">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Δ</div>
      <h2 style="font-size:20px;margin-top:8px;">管理后台</h2>
      <p style="color:var(--text-secondary);font-size:13px;">鸿門工作室 Admin Panel</p>
    </div>
    <div class="form-error" id="adminLoginError" style="display:none;"></div>
    <form onsubmit="adminLogin(event)">
      <div class="form-group"><label>用户名</label><input type="text" id="adminUsername" placeholder="admin" required></div>
      <div class="form-group"><label>密码</label><input type="password" id="adminPassword" placeholder="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">登录后台</button>
    </form>
  </div>
</div>

<div class="admin-layout" id="adminLayout">
  <aside class="admin-sidebar">
    <div class="logo">Δ Delta <span class="badge">Admin</span></div>
    <ul class="admin-nav">
      <li><a class="active" onclick="switchPage('dashboard', this)"><span class="icon">D</span> 仪表盘</a></li>
      <li><a onclick="switchPage('orders', this)"><span class="icon">O</span> 订单管理</a></li>
      <li><a onclick="switchPage('products', this)"><span class="icon">P</span> 商品管理</a></li>
      <li><a onclick="switchPage('messages', this)"><span class="icon">M</span> 客服消息</a></li>
    </ul>
    <div class="admin-logout" onclick="admin退出登录()">退出登录</div>
  </aside>
  <main class="admin-main">
    <div class="admin-page active" id="pageDashboard">
      <div class="admin-header"><h1>仪表盘</h1><p>Delta Studio 运营概览</p></div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-label">总订单</div><div class="stat-value" id="statOrders">-</div></div>
        <div class="stat-card"><div class="stat-label">待处理</div><div class="stat-value red" id="statPending">-</div></div>
        <div class="stat-card"><div class="stat-label">总收入</div><div class="stat-value gold" id="statRevenue">-</div></div>
        <div class="stat-card"><div class="stat-label">商品数</div><div class="stat-value" id="statProducts">-</div></div>
        <div class="stat-card"><div class="stat-label">客服消息</div><div class="stat-value" id="statContacts">-</div></div>
        <div class="stat-card"><div class="stat-label">未读</div><div class="stat-value red" id="statUnread">-</div></div>
      </div>
      <div id="dashboardOrders"></div>
    </div>
    <div class="admin-page" id="pageOrders">
      <div class="admin-header"><h1>订单管理</h1><p>查看和管理客户订单</p></div>
      <div class="admin-header-bar">
        <div class="flex-row">
          <button class="category-filter active" onclick="filterOrders('all',this)">全部</button>
          <button class="category-filter" onclick="filterOrders('pending',this)">待处理</button>
          <button class="category-filter" onclick="filterOrders('confirmed',this)">已确认</button>
          <button class="category-filter" onclick="filterOrders('processing',this)">进行中</button>
          <button class="category-filter" onclick="filterOrders('completed',this)">已完成</button>
          <button class="category-filter" onclick="filterOrders('cancelled',this)">已取消</button>
        </div>
      </div>
      <div id="ordersContainer"></div>
    </div>
    <div class="admin-page" id="pageProducts">
      <div class="admin-header"><h1>商品数</h1><p>Manage services</p></div>
      <div class="admin-header-bar">
        <button class="btn btn-primary btn-sm" onclick="showProductModal()">+ 添加商品</button>
      </div>
      <div id="productsContainer"></div>
    </div>
    <div class="admin-page" id="pageMessages">
      <div class="admin-header"><h1>客服消息</h1><p>Customer inquiries</p></div>
      <div class="admin-header-bar">
        <div class="flex-row">
          <button class="category-filter active" onclick="filter客服消息('all',this)">全部</button>
          <button class="category-filter" onclick="filter客服消息('unread',this)">未读</button>
          <button class="category-filter" onclick="filter客服消息('read',this)">已读</button>
          <button class="category-filter" onclick="filter客服消息('replied',this)">已回复</button>
        </div>
      </div>
      <div id="messagesContainer"></div>
    </div>
  </main>
</div>

<div class="toast-container" id="adminToast"></div>

<div class="modal-overlay" id="adminModal">
  <div class="modal modal-content">
    <button class="modal-close" onclick="closeAdminModal()">x</button>
    <h2 id="adminModalTitle">添加商品</h2>
    <form id="adminModalForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="editProductId">
      <div class="form-group"><label>商品名称 *</label><input type="text" id="prodName" required></div>
      <div class="form-group"><label>描述</label><textarea id="prodDesc" rows="2"></textarea></div>
      <div class="form-group"><label>价格 (¥) *</label><input type="number" id="prodPrice" step="0.01" min="0" required></div>
      <div class="form-group"><label>分类</label><input type="text" id="prodCategory" placeholder="如: 设计服务"></div>
      <div class="form-group"><label>库存</label><input type="number" id="prodStock" value="99" min="0"></div>
      <div class="form-group"><label>图片链接</label><input type="text" id="prodImage" placeholder="可选"></div>
      <button type="submit" class="btn btn-primary btn-block" id="adminModalBtn">保存</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="replyModal">
  <div class="modal modal-content">
    <button class="modal-close" onclick="close回复内容Modal()">x</button>
    <h2>回复消息</h2>
    <div id="replyMessageInfo" style="margin-bottom:16px;padding:12px;background:var(--bg-primary);border-radius:8px;font-size:13px;color:var(--text-secondary);"></div>
    <form onsubmit="submitReply(event)">
      <input type="hidden" id="replyContactId">
      <div class="form-group"><label>回复内容</label><textarea id="replyContent" rows="4" required></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Send 回复内容</button>
    </form>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
